<!DOCTYPE html>
<!--
  번개까지 거리 재기 — 빛과 소리의 속도 체험 게임
  같은 폴더에 넣어주세요:
    night-sky.jpg  /  1.mp3  /  2.mp3  /  3.mp3  /  4.mp3
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>번개까지 거리 재기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060d1f; font-family: 'Noto Sans KR', sans-serif; }

    :root {
      --ground:    #060d1f;
      --surface:   #0d1c3e;
      --border:    rgba(150,210,255,0.15);
      --text:      #e2efff;
      --text-sub:  #6faed3;
      --text-dim:  #344e6a;
      --bolt:      #f5e84e;
      --bolt-glow: rgba(245,232,78,0.36);
      --ok:        #4bd98a;
      --warn:      #f5a347;
      --bad:       #f56060;
    }

    /* ── Background ── */
    #sky         { position:fixed; inset:0; z-index:0; background:url('night-sky.jpg') center bottom/cover no-repeat, var(--ground); }
    #rain-canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }
    #flash       { position:fixed; inset:0; z-index:2; background:#fff; opacity:0; pointer-events:none; }

    /* ── Round HUD (top-right during game) ── */
    #round-hud {
      position: fixed;
      top: clamp(14px,2.5vh,28px);
      right: clamp(14px,2.5vw,32px);
      z-index: 25;
      display: none;
      text-align: right;
      background: rgba(13,28,62,.88);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 18px;
    }
    #hud-round { font-family:'Black Han Sans',sans-serif; font-size:clamp(.95rem,2vw,1.25rem); color:var(--bolt); display:block; }
    #hud-total { font-size:clamp(.68rem,1.3vw,.82rem); color:var(--text-sub); margin-top:2px; display:block; }

    /* ── Common overlay ── */
    .overlay { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }

    /* ── Start screen ── */
    #start-screen { z-index:10; }
    #start-screen.overlay { display:flex; }
    .eyebrow { font-size:clamp(.72rem,1.4vw,.9rem); font-weight:700; letter-spacing:.22em; color:var(--bolt); text-transform:uppercase; margin-bottom:22px; opacity:.85; }
    .main-title { font-family:'Black Han Sans',sans-serif; font-size:clamp(3.2rem,9.5vw,7rem); color:var(--text); line-height:1; letter-spacing:-2px; margin-bottom:10px; text-wrap:balance; text-shadow:0 0 80px rgba(80,150,255,.28); }
    .main-title em { font-style:normal; color:var(--bolt); text-shadow:0 0 30px var(--bolt-glow),0 0 70px var(--bolt-glow); }
    .main-desc { font-size:clamp(.92rem,1.9vw,1.18rem); color:var(--text-sub); line-height:1.8; margin:22px 0 52px; }
    #btn-start { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.15rem,2.4vw,1.65rem); color:var(--ground); background:var(--bolt); border:none; border-radius:100px; padding:20px 84px; cursor:pointer; letter-spacing:5px; position:relative; box-shadow:0 0 50px var(--bolt-glow),0 6px 32px rgba(0,0,0,.45); transition:transform .15s,box-shadow .15s; }
    #btn-start::before { content:''; position:absolute; inset:-6px; border-radius:100px; border:2px solid rgba(245,232,78,.32); animation:pulse-ring 2.5s ease-in-out infinite; }
    @keyframes pulse-ring { 0%,100%{opacity:.3;transform:scale(1)} 50%{opacity:.75;transform:scale(1.06)} }
    #btn-start:hover { transform:scale(1.07); box-shadow:0 0 72px var(--bolt-glow),0 10px 44px rgba(0,0,0,.5); }
    #btn-start:active { transform:scale(.97); }

    /* ── Instruction ── */
    #instruction { z-index:15; background:rgba(6,13,31,.80); }
    @keyframes instr-fade { 0%{opacity:0;transform:scale(.94)} 14%{opacity:1;transform:scale(1)} 78%{opacity:1} 100%{opacity:0} }
    .instr-main { font-family:'Black Han Sans',sans-serif; font-size:clamp(2rem,6.5vw,5rem); color:var(--text); line-height:1.25; margin-bottom:20px; text-wrap:balance; }
    .instr-main em { font-style:normal; color:var(--bolt); text-shadow:0 0 28px var(--bolt-glow); }
    .instr-sub { font-size:clamp(1rem,2.2vw,1.4rem); font-weight:500; color:var(--text-sub); line-height:1.75; }

    /* ── Hint ── */
    #hint { position:fixed; top:clamp(28px,4.5vh,56px); left:50%; transform:translateX(-50%); font-weight:700; font-size:clamp(1rem,2.4vw,1.45rem); color:var(--text); white-space:nowrap; text-shadow:0 2px 28px rgba(6,13,31,.97); pointer-events:none; z-index:8; display:none; }
    @keyframes hint-in { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

    /* ── Question ── */
    #question { position:fixed; bottom:0; left:0; right:0; background:linear-gradient(180deg,transparent 0%,rgba(6,13,31,.97) 20%); padding:clamp(28px,5vh,64px) clamp(24px,5vw,80px) clamp(38px,6.5vh,72px); display:none; flex-direction:column; align-items:center; gap:22px; z-index:20; }
    @keyframes slide-up { from{opacity:0;transform:translateY(32px)} to{opacity:1;transform:translateY(0)} }
    .q-label { font-size:clamp(.68rem,1.3vw,.84rem); font-weight:700; letter-spacing:.2em; color:var(--bolt); text-transform:uppercase; }
    .q-main { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.4rem,3.8vw,2.5rem); color:var(--text); text-align:center; line-height:1.28; text-wrap:balance; }
    .answer-row { display:flex; align-items:center; gap:clamp(8px,1.6vw,16px); flex-wrap:wrap; justify-content:center; }
    .yak-label { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.3rem,3vw,2rem); color:var(--bolt); }
    #answer-input { font-family:'Noto Sans KR',sans-serif; font-weight:900; font-size:clamp(1.6rem,3.8vw,2.5rem); font-variant-numeric:tabular-nums; color:var(--text); background:rgba(255,255,255,.055); border:2px solid var(--border); border-radius:14px; padding:13px 22px; width:clamp(150px,22vw,250px); text-align:center; outline:none; transition:border-color .2s,box-shadow .2s; -moz-appearance:textfield; }
    #answer-input::-webkit-outer-spin-button,#answer-input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    #answer-input::placeholder { color:var(--text-dim); }
    #answer-input:focus { border-color:var(--bolt); box-shadow:0 0 0 3px var(--bolt-glow); }
    #answer-input.shake { border-color:var(--bad); box-shadow:0 0 0 3px rgba(245,96,96,.28); animation:shake .35s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 28%{transform:translateX(-9px)} 72%{transform:translateX(9px)} }
    .unit { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.4rem,3.2vw,2rem); color:var(--text-sub); }
    #btn-check { font-family:'Black Han Sans',sans-serif; font-size:clamp(.95rem,2.1vw,1.38rem); color:#051d0e; background:var(--ok); border:none; border-radius:14px; padding:15px 44px; cursor:pointer; letter-spacing:1px; box-shadow:0 4px 26px rgba(75,217,138,.3); transition:transform .15s,box-shadow .15s; }
    #btn-check:hover { transform:translateY(-3px); box-shadow:0 8px 36px rgba(75,217,138,.5); }
    #btn-check:active { transform:translateY(0); }

    /* ── Result card ── */
    #result { z-index:30; background:rgba(6,13,31,.87); }
    @keyframes fade-bg { from{opacity:0} to{opacity:1} }
    @keyframes card-in { from{opacity:0;transform:scale(.91) translateY(18px)} to{opacity:1;transform:scale(1) translateY(0)} }
    .result-card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:clamp(22px,3.5vw,44px) clamp(22px,4.5vw,56px); max-width:640px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 0 80px rgba(0,0,0,.65); animation:card-in .48s cubic-bezier(.2,1,.4,1) both; }

    /* shared result elements */
    .res-icon  { font-size:clamp(2.5rem,6.5vw,4rem); line-height:1; margin-bottom:6px; }
    .res-grade { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.4rem,3.5vw,2.3rem); margin-bottom:8px; }
    .round-badge { display:inline-block; font-size:clamp(.7rem,1.3vw,.84rem); font-weight:700; letter-spacing:.18em; color:var(--bolt); text-transform:uppercase; background:rgba(245,232,78,.1); border:1px solid rgba(245,232,78,.25); border-radius:100px; padding:4px 14px; margin-bottom:14px; }
    .score-display { font-family:'Black Han Sans',sans-serif; font-size:clamp(2.2rem,5.5vw,3.6rem); color:var(--bolt); text-shadow:0 0 30px var(--bolt-glow); line-height:1; }
    .score-label { font-size:clamp(.66rem,1.2vw,.8rem); font-weight:700; letter-spacing:.2em; color:var(--text-sub); text-transform:uppercase; margin-top:2px; margin-bottom:14px; }
    .running-total { font-size:clamp(.85rem,1.7vw,1rem); color:var(--text-sub); margin-bottom:14px; }
    .running-total strong { color:var(--text); }
    .res-detail { font-size:clamp(.82rem,1.65vw,1rem); color:var(--text-sub); line-height:1.9; margin-bottom:16px; }
    .res-detail strong { color:var(--text); font-weight:900; }
    .formula-box { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:12px; padding:11px 20px; margin:10px 0; font-variant-numeric:tabular-nums; font-size:clamp(.82rem,1.6vw,1rem); color:var(--text); line-height:1.85; }
    .formula-answer { color:var(--bolt); font-weight:900; font-size:1.14em; }

    /* round score breakdown */
    .breakdown { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin:12px 0 16px; }
    .breakdown td { padding:6px 0; font-size:clamp(.78rem,1.5vw,.92rem); border-bottom:1px solid rgba(150,210,255,.06); }
    .breakdown .bd-round { color:var(--text-sub); }
    .breakdown .bd-score { text-align:right; font-weight:700; color:var(--text); }
    .breakdown .bd-total td { border-top:1px solid var(--border); border-bottom:none; padding-top:10px; font-weight:900; }
    .breakdown .bd-total .bd-round { color:var(--text); }
    .breakdown .bd-total .bd-score { color:var(--bolt); font-size:1.15em; }

    /* name + ranking */
    .name-row { display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
    #name-input { font-family:'Noto Sans KR',sans-serif; font-size:clamp(.9rem,1.8vw,1.1rem); color:var(--text); background:rgba(255,255,255,.06); border:2px solid var(--border); border-radius:10px; padding:10px 16px; width:140px; outline:none; transition:border-color .2s; }
    #name-input:focus { border-color:var(--bolt); }
    #name-input::placeholder { color:var(--text-dim); }
    .btn-save-rank { font-family:'Black Han Sans',sans-serif; font-size:clamp(.82rem,1.6vw,.98rem); color:var(--ground); background:var(--bolt); border:none; border-radius:10px; padding:11px 22px; cursor:pointer; letter-spacing:1px; transition:transform .15s,box-shadow .15s; white-space:nowrap; }
    .btn-save-rank:hover { transform:translateY(-2px); box-shadow:0 4px 16px var(--bolt-glow); }

    /* buttons */
    .result-btn-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .btn-next { font-family:'Black Han Sans',sans-serif; font-size:clamp(1rem,2vw,1.3rem); color:var(--ground); background:var(--ok); border:none; border-radius:100px; padding:14px 52px; cursor:pointer; letter-spacing:3px; box-shadow:0 4px 24px rgba(75,217,138,.28); transition:transform .15s,box-shadow .15s; }
    .btn-next:hover { transform:translateY(-3px); box-shadow:0 8px 36px rgba(75,217,138,.5); }
    .btn-retry { font-family:'Black Han Sans',sans-serif; font-size:clamp(.88rem,1.8vw,1.15rem); color:var(--text); background:rgba(255,255,255,.07); border:2px solid var(--border); border-radius:100px; padding:13px 40px; cursor:pointer; letter-spacing:3px; transition:background .2s,border-color .2s,transform .15s; }
    .btn-retry:hover { background:rgba(255,255,255,.13); border-color:rgba(150,210,255,.38); transform:translateY(-2px); }
    .btn-show-rank { font-family:'Black Han Sans',sans-serif; font-size:clamp(.88rem,1.8vw,1.15rem); color:var(--text); background:rgba(100,150,255,.12); border:2px solid rgba(100,150,255,.28); border-radius:100px; padding:13px 32px; cursor:pointer; letter-spacing:2px; transition:background .2s,border-color .2s,transform .15s; }
    .btn-show-rank:hover { background:rgba(100,150,255,.22); border-color:rgba(100,150,255,.5); transform:translateY(-2px); }

    /* ── Ranking ── */
    #ranking { z-index:50; background:rgba(6,13,31,.93); }
    .ranking-card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:clamp(22px,4vw,44px) clamp(18px,4vw,44px); max-width:640px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 0 80px rgba(0,0,0,.7); }
    .ranking-title { font-family:'Black Han Sans',sans-serif; font-size:clamp(1.4rem,3vw,2rem); color:var(--bolt); text-align:center; margin-bottom:22px; text-shadow:0 0 20px var(--bolt-glow); }
    .ranking-table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    .ranking-table th { font-size:clamp(.64rem,1.2vw,.78rem); font-weight:700; letter-spacing:.12em; color:var(--text-sub); text-transform:uppercase; padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); }
    .ranking-table td { font-size:clamp(.8rem,1.6vw,.96rem); color:var(--text); padding:10px 10px; border-bottom:1px solid rgba(150,210,255,.06); }
    .rank-medal { font-size:1.2em; }
    .rank-name  { font-weight:700; }
    .rank-score { font-weight:900; color:var(--bolt); }
    .ranking-empty { text-align:center; color:var(--text-sub); padding:36px; font-size:clamp(.9rem,1.8vw,1.1rem); }
    .ranking-btn-row { display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap; }
    .btn-close-rank { font-family:'Black Han Sans',sans-serif; font-size:clamp(.88rem,1.7vw,1.08rem); color:var(--text); background:rgba(255,255,255,.07); border:2px solid var(--border); border-radius:100px; padding:12px 44px; cursor:pointer; letter-spacing:2px; transition:background .2s,transform .15s; }
    .btn-close-rank:hover { background:rgba(255,255,255,.13); transform:translateY(-2px); }
    .btn-clear-rank { font-family:'Black Han Sans',sans-serif; font-size:clamp(.75rem,1.4vw,.88rem); color:var(--bad); background:transparent; border:1px solid rgba(245,96,96,.3); border-radius:100px; padding:10px 24px; cursor:pointer; transition:background .2s; }
    .btn-clear-rank:hover { background:rgba(245,96,96,.1); }

    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>

<div id="sky"></div>
<canvas id="rain-canvas"></canvas>
<div id="flash"></div>

<!-- Round HUD -->
<div id="round-hud">
  <span id="hud-round">1 / 5</span>
  <span id="hud-total">합계 0점</span>
</div>

<!-- Start screen -->
<div id="start-screen" class="overlay">
  <div class="eyebrow">빛과 소리의 속도 체험 게임</div>
  <h1 class="main-title">번개까지<br><em>거리</em> 재기</h1>
  <p class="main-desc">번개가 번쩍! → 속으로 초를 세요 🌩<br>천둥이 우르릉! → 거리를 계산해요 🔊<br><br>5라운드 합산으로 랭킹에 도전하세요!</p>
  <button id="btn-start" onclick="startGame()">시 작 !</button>
</div>

<!-- 3초 안내 -->
<div id="instruction" class="overlay">
  <div class="instr-main">번개가 <em>번쩍!</em><br>→ 속으로 초를 세요</div>
  <div class="instr-sub">천둥 소리가 들릴 때까지 기다려요 👂<br>그 시간으로 거리를 계산해요!</div>
</div>

<!-- Hint -->
<div id="hint"></div>

<!-- Question -->
<div id="question">
  <div class="q-label">계산해봐요</div>
  <div class="q-main">방금 번개는 나로부터<br>얼마나 멀리 있었을까요?</div>
  <div class="answer-row">
    <span class="yak-label">약</span>
    <input type="number" id="answer-input" placeholder="거리 입력" min="0" step="1">
    <span class="unit">m</span>
    <button id="btn-check" onclick="checkAnswer()">정답 확인!</button>
  </div>
</div>

<!-- Result (content injected by JS) -->
<div id="result" class="overlay">
  <div class="result-card" id="result-card"></div>
</div>

<!-- Ranking -->
<div id="ranking" class="overlay">
  <div class="ranking-card">
    <div class="ranking-title">🏆 명예의 전당</div>
    <div id="ranking-body"></div>
    <div class="ranking-btn-row">
      <button class="btn-close-rank" onclick="closeRanking()">닫기</button>
      <button class="btn-clear-rank" onclick="clearRanking()">기록 초기화</button>
    </div>
  </div>

  ];
  thunderAudios[0].volume = 1.0;  // 0~4초: 상대적 2배
  thunderAudios[1].volume = 0.5;
  thunderAudios[2].volume = 0.5;
  thunderAudios[3].volume = 0.5;

  /* ── Game state ── */
  var timers       = [];
  var rafId        = null;
  var drops        = [];
  var active       = false;
  var thunderDelay = 0;
  var correctDist  = 0;
  var currentScore = 0;

  // 라운드 관리
  var currentRound = 0;   // 완료된 라운드 수 (0~5)
  var totalScore   = 0;
  var roundScores  = [];  // 라운드별 점수 배열

  /* ── Audio ── */
  function getThunderAudio() {
    if (thunderDelay <= 4)  return thunderAudios[0];
    if (thunderDelay <= 9)  return thunderAudios[1];
    if (thunderDelay <= 15) return thunderAudios[2];
    return thunderAudios[3];
  }

  /* ── Rain ── */
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function makeDrops() {
    var n = Math.floor((canvas.width * canvas.height) / 7200);
    drops = [];
    for (var i = 0; i < n; i++) {
      drops.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height,
                   speed:10+Math.random()*10, len:14+Math.random()*20, a:.10+Math.random()*.30 });
    }
  }

  function drawRain() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 1;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      ctx.globalAlpha = d.a;
      ctx.strokeStyle = 'rgba(188,224,254,1)';
      ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x-1.8, d.y+d.len); ctx.stroke();
      d.y += d.speed; d.x -= 1.6;
      if (d.y > canvas.height || d.x < -8) { d.x = Math.random()*canvas.width+20; d.y = -d.len-Math.random()*60; }
    }
    ctx.globalAlpha = 1;
    rafId = requestAnimationFrame(drawRain);
  }

  function stopRain() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } ctx.clearRect(0,0,canvas.width,canvas.height); }

  /* ── Timers ── */
  function after(ms, fn) { var id = setTimeout(fn, ms); timers.push(id); }
  function clearAll() { timers.forEach(clearTimeout); timers = []; }

  /* ── HUD ── */
  function updateHUD() {
    hudRound.textContent = (currentRound + 1) + ' / ' + TOTAL_ROUNDS;
    hudTotal.textContent = '합계 ' + totalScore + '점';
  }

  /* ── Flash ── */
  function doFlash(onDone) {
    var seq = [[1.0,.055],[.05,.048],[.92,.095],[.14,.075],[.58,.075],[0,.45]];
    var i = 0;
    function step() {
      if (!active) { flash.style.opacity = 0; return; }
      if (i >= seq.length) { flash.style.opacity = 0; if (onDone) onDone(); return; }
      flash.style.transition = 'opacity '+seq[i][1]+'s linear';
      flash.style.opacity    = seq[i][0];
      timers.push(setTimeout(step, seq[i][1]*1000+12));
      i++;
    }
    flash.style.transition = 'none'; flash.style.opacity = 0;
    requestAnimationFrame(step);
  }

  /* ── Score ── */
  function calcScore(diff) {
    if (diff >= SCORE_LIMIT) return 0;
    return Math.round(100 * (1 - diff / SCORE_LIMIT));
  }

  function gradeFromScore(score) {
    if (score === 100) return { icon:'🎉', grade:'완벽한 정답!',     color:'#f5e84e' };
    if (score >= 80)   return { icon:'🥇', grade:'거의 완벽해요!',   color:'#f5e84e' };
    if (score >= 50)   return { icon:'🥈', grade:'아주 아깝네요!',   color:'#a8d4ff' };
    if (score >= 20)   return { icon:'🥉', grade:'조금 아쉬워요!',   color:'#f5a347' };
    if (score > 0)     return { icon:'💪', grade:'함께 계산해봐요!', color:'#f56060' };
                       return { icon:'❌', grade:'오답이에요!',       color:'#f56060' };
  }

  /* ── Formula HTML ── */
  function formulaHTML() {
    if (thunderDelay === 0) {
      return '번개와 천둥이 동시에 들렸어요!<br>번개가 바로 코앞에 있었다는 뜻이에요 😱'
           + '<div class="formula-box"><span class="formula-answer">정답: 0 m (바로 앞!)</span></div>';
    }
    return '번개 → 천둥까지 <strong>' + thunderDelay + '초</strong>가 걸렸어요'
         + '<div class="formula-box">'
         + '거리 = 소리 속도 × 시간<br>'
         + '= 343 m/초 × ' + thunderDelay + '초<br>'
         + '<span class="formula-answer">≈ ' + correctDist.toLocaleString() + ' m</span>'
         + '</div>';
  }

  /* ── Game phases ── */
  window.startGame = function () {
    startScreen.style.display = 'none';
    currentRound = 0; totalScore = 0; roundScores = [];
    active = true;

    instruction.style.display   = 'flex';
    instruction.style.animation = 'none';
    void instruction.offsetWidth;
    instruction.style.animation = 'instr-fade 3s ease forwards';

    after(3000, function () {
      if (!active) return;
      instruction.style.display = 'none';
      updateHUD();
      roundHud.style.display = 'block';
      resize(); makeDrops(); drawRain();
      after(2000 + Math.floor(Math.random()*5001), phase_lightning);
    });
  };

  function phase_lightning() {
    if (!active) return;
    thunderDelay = parseFloat((Math.random() * 20).toFixed(2));
    correctDist  = Math.round(thunderDelay * SOUND_SPEED);
    after(Math.round(thunderDelay * 1000), phase_thunder);
    doFlash(null);
  }

  function phase_thunder() {
    if (!active) return;
    hint.style.display = 'none';
    var audio = getThunderAudio();
    audio.currentTime = 0;
    audio.play().catch(function(){});
    after(6000, phase_question);
  }

  function phase_question() {
    if (!active) return;
    hint.style.display = 'none';
    question.style.display   = 'flex';
    question.style.animation = 'none';
    void question.offsetWidth;
    question.style.animation = 'slide-up .52s cubic-bezier(.2,1,.4,1) forwards';
    answerInput.value = ''; answerInput.className = '';
    answerInput.focus();
  }

  /* ── Answer ── */
  window.checkAnswer = function () {
    var raw = answerInput.value.trim();
    if (raw === '' || isNaN(+raw) || +raw < 0) {
      answerInput.className = 'shake';
      setTimeout(function(){ answerInput.className=''; }, 420);
      return;
    }
    var userAns = Math.round(+raw);
    question.style.display = 'none';

    var diff     = Math.abs(userAns - correctDist);
    currentScore = calcScore(diff);
    var g        = gradeFromScore(currentScore);

    currentRound++;
    roundScores.push(currentScore);
    totalScore += currentScore;
    updateHUD();

    var isFinal = (currentRound >= TOTAL_ROUNDS);
    var html = '';

    if (isFinal) {
      /* ── 최종 결과 ── */
      var finalGrade = gradeFromScore(Math.round(totalScore / TOTAL_ROUNDS));
      html += '<div class="res-icon">🏆</div>';
      html += '<div class="res-grade" style="color:#f5e84e">5라운드 완료!</div>';
      html += '<div class="score-display">' + totalScore + '점</div>';
      html += '<div class="score-label">최종 합계 점수 (만점 500점)</div>';

      // 라운드별 점수 표
      html += '<table class="breakdown">';
      for (var i = 0; i < roundScores.length; i++) {
        html += '<tr><td class="bd-round">라운드 ' + (i+1) + '</td><td class="bd-score">' + roundScores[i] + '점</td></tr>';
      }
      html += '<tr class="bd-total"><td class="bd-round">최종 합계</td><td class="bd-score">' + totalScore + '점</td></tr>';
      html += '</table>';

      // 이번 라운드 정답 공개
      html += '<div class="res-detail">마지막 라운드 — ' + formulaHTML();
      if (currentScore === 0 && diff > 0) {
        html += '<div style="color:var(--bad);font-size:.86em;margin-top:6px">오차 ' + diff.toLocaleString() + ' m — ±686m 범위를 벗어났어요</div>';
      }
      html += '</div>';

      // 이름 + 랭킹 저장
      html += '<div class="name-row">'
            + '<input type="text" id="name-input" placeholder="이름 (선택)" maxlength="8">'
            + '<button class="btn-save-rank" onclick="saveRanking()">랭킹 저장</button>'
            + '</div>';
      html += '<div class="result-btn-row">'
            + '<button class="btn-show-rank" onclick="showRanking()">🏆 랭킹 보기</button>'
            + '<button class="btn-retry" onclick="resetGame()">다시 하기</button>'
            + '</div>';
    } else {
      /* ── 중간 결과 ── */
      html += '<div class="res-icon">' + g.icon + '</div>';
      html += '<div class="res-grade" style="color:' + g.color + '">' + g.grade + '</div>';
      html += '<div class="round-badge">라운드 ' + currentRound + ' / ' + TOTAL_ROUNDS + '</div>';
      html += '<div class="score-display">' + currentScore + '점</div>';
      html += '<div class="score-label">이번 라운드</div>';
      html += '<div class="running-total">현재 합계 <strong>' + totalScore + '점</strong></div>';
      html += '<div class="res-detail">' + formulaHTML();
      if (currentScore === 0 && diff > 0) {
        html += '<div style="color:var(--bad);font-size:.86em;margin-top:6px">오차 ' + diff.toLocaleString() + ' m — ±686m 범위를 벗어났어요</div>';
      }
      html += '</div>';
      html += '<div class="result-btn-row">'
            + '<button class="btn-next" onclick="nextRound()">다음 라운드 →</button>'
            + '</div>';
    }

    resultCard.innerHTML = html;
    result.style.display   = 'flex';
    result.style.animation = 'fade-bg .35s ease both';
    resultCard.scrollTop   = 0;
  };

  /* ── Next round ── */
  window.nextRound = function () {
    result.style.display = 'none';
    updateHUD();
    after(1500 + Math.floor(Math.random()*2000), phase_lightning);
  };

  /* ── Ranking ── */
  function loadRankData() {
    try { return JSON.parse(localStorage.getItem(RANK_KEY)) || []; } catch(e) { return []; }
  }

  window.saveRanking = function () {
    var nameEl = document.getElementById('name-input');
    var name   = (nameEl ? nameEl.value.trim() : '') || '이름없음';
    var data   = loadRankData();
    data.push({ name:name, score:totalScore, date:new Date().toLocaleDateString('ko-KR') });
    data.sort(function(a,b){ return b.score - a.score; });
    data = data.slice(0, 10);
    localStorage.setItem(RANK_KEY, JSON.stringify(data));
    showRanking();
  };

  window.showRanking = function () {
    var data   = loadRankData();
    var body   = document.getElementById('ranking-body');
    var medals = ['🥇','🥈','🥉'];
    if (data.length === 0) {
      body.innerHTML = '<div class="ranking-empty">아직 기록이 없어요!<br>5라운드를 마치고 저장해보세요 🌩</div>';
    } else {
      var rows = data.map(function(r,i){
        return '<tr>'
          + '<td class="rank-medal">' + (medals[i]||((i+1)+'위')) + '</td>'
          + '<td class="rank-name">' + r.name + '</td>'
          + '<td class="rank-score">' + r.score + '점</td>'
          + '<td style="color:var(--text-sub);font-size:.82em">' + r.date + '</td>'
          + '</tr>';
      }).join('');
      body.innerHTML = '<table class="ranking-table">'
        + '<thead><tr><th>순위</th><th>이름</th><th>합계점수</th><th>날짜</th></tr></thead>'
        + '<tbody>' + rows + '</tbody></table>';
    }
    ranking.style.display   = 'flex';
    ranking.style.animation = 'fade-bg .3s ease both';
  };

  window.closeRanking  = function () { ranking.style.display = 'none'; };
  window.clearRanking  = function () {
    if (confirm('랭킹 기록을 모두 삭제할까요?')) {
      localStorage.removeItem(RANK_KEY);
      showRanking();
    }
  };

  /* ── Reset ── */
  window.resetGame = function () {
    active = false;
    clearAll();
    thunderAudios.forEach(function(a){ a.pause(); a.currentTime=0; });
    flash.style.transition    = 'none';
    flash.style.opacity       = 0;
    instruction.style.display = 'none';
    question.style.display    = 'none';
    result.style.display      = 'none';
    ranking.style.display     = 'none';
    hint.style.display        = 'none';
    roundHud.style.display    = 'none';
    currentRound = 0; totalScore = 0; roundScores = [];
    stopRain();
    startScreen.style.display = 'flex';
  };

  answerInput.addEventListener('keydown', function(e){ if(e.key==='Enter') window.checkAnswer(); });
})();
</script>
</body>
</html>
